[routers]
target

[routers:vars]
# ต่อ router ด้วย SSH แบบ CLI ของอุปกรณ์เครือข่าย
ansible_connection=ansible.netcommon.network_cli
# บอกว่าเป็น Cisco IOS
ansible_network_os=cisco.ios.ios
# user/pass อ่านจาก environment (ห้ามเขียนรหัสผ่านลงไฟล์)
ansible_user="{{ lookup('env', 'ROUTER_USER') }}"
ansible_password="{{ lookup('env', 'ROUTER_PASS') }}"
ansible_network_cli_ssh_type=paramiko